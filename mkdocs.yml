site_name: Control of Self-Driving Vehicles
site_description: Hands-on control engineering course for the Smart Vehicles Summer School 2026
site_author: Rudolf Krecht
site_url: https://rudolfkrecht.github.io/smart_vehicles_control/
repo_url: https://github.com/rudolfkrecht/smart_vehicles_control
repo_name: rudolfkrecht/smart_vehicles_control

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.tabs.link
  palette:
    - scheme: default
      primary: blue
      accent: light blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: light blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - assets/stylesheets/extra.css

nav:
  - Home:
      - Course overview: index.md
      - Four-day schedule: schedule.md
      - Software setup: setup.md
  - Day 1 — Longitudinal Control:
      - Day overview: day1/index.md
      - 1. Theory overview: day1/lesson1.md
      - 2. Practical demonstrations: day1/lesson2.md
      - 3. Numerical examples: day1/lesson3.md
      - 4. Simulator-based examples: day1/lesson4.md
      - 5. Longitudinal control in 3D simulator: day1/lesson5.md
      - 6. Project work: day1/lesson6.md
  - Day 2 — Path Following:
      - Day overview: day2/index.md
      - 1. Theory overview: day2/lesson1.md
      - 2. Practical demonstrations: day2/lesson2.md
      - 3. Numerical examples: day2/lesson3.md
      - 4. Simulator-based examples: day2/lesson4.md
      - 5. Lateral control in 3D simulator: day2/lesson5.md
      - 6. Project work: day2/lesson6.md
  - Day 3 — Integrated ADAS:
      - Day overview: day3/index.md
      - 1. Theory overview: day3/lesson1.md
      - 2. Practical demonstrations: day3/lesson2.md
      - 3. Numerical examples: day3/lesson3.md
      - 4. Simulator-based examples: day3/lesson4.md
      - 5. ADAS in 3D simulator: day3/lesson5.md
      - 6. Project workshop: day3/lesson6.md
  - Day 4 — Testing and Robustness:
      - Day overview: day4/index.md
      - 1. Theory overview: day4/lesson1.md
      - 2. Practical demonstrations: day4/lesson2.md
      - 3. Numerical examples: day4/lesson3.md
      - 4. Simulator-based examples: day4/lesson4.md
      - 5. Robustness verification in simulator: day4/lesson5.md
      - 6. Project work: day4/lesson6.md
  - Resources:
      - Python reference: resources/python-reference.md
      - Formula sheet: resources/formula-sheet.md
      - Troubleshooting: resources/troubleshooting.md
  - Project submission: submission.md
